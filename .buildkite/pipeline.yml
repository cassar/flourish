steps:
  - label: ":docker: Warm CI Cache"
    key: warm-cache
    concurrency: 1
    concurrency_group: cassar/docker-ci-cache
    command: |
      REGISTRY=100.115.240.52:5555
      CI_REPO=flourish-ci
      LOCK_SHA=$$( (sha256sum Gemfile.lock Dockerfile.ci; uname -m) | sha256sum | cut -d' ' -f1)
      echo "$$KAMAL_REGISTRY_PASSWORD" | docker login $$REGISTRY -u kamal --password-stdin
      STATUS=$$(curl -s -o /dev/null -w '%{http_code}' -u "kamal:$$KAMAL_REGISTRY_PASSWORD" -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' http://$$REGISTRY/v2/$$CI_REPO/manifests/$$LOCK_SHA)
      if [ "$$STATUS" = "200" ]; then
        echo "CI image $$CI_REPO:$$LOCK_SHA already exists, skipping build"
      else
        docker pull $$REGISTRY/$$CI_REPO:latest 2>/dev/null || true
        docker build -f Dockerfile.ci \
          --cache-from $$REGISTRY/$$CI_REPO:latest \
          --label service=flourish_ci \
          -t $$REGISTRY/$$CI_REPO:$$LOCK_SHA \
          -t $$REGISTRY/$$CI_REPO:latest \
          .
        docker push $$REGISTRY/$$CI_REPO:$$LOCK_SHA
        docker push $$REGISTRY/$$CI_REPO:latest
      fi
    agents:
      queue: default-queue

  - label: ":ruby: Test"
    key: test
    depends_on: warm-cache
    concurrency: 2
    concurrency_group: cassar/docker-test
    command: |
      REGISTRY=100.115.240.52:5555
      CI_IMAGE=$$REGISTRY/flourish-ci:$$( (sha256sum Gemfile.lock Dockerfile.ci; uname -m) | sha256sum | cut -d' ' -f1)
      echo "$$KAMAL_REGISTRY_PASSWORD" | docker login $$REGISTRY -u kamal --password-stdin
      docker pull $$CI_IMAGE || docker pull $$CI_IMAGE
      docker run --rm \
        -e RAILS_ENV=test \
        -e CI=true \
        $$CI_IMAGE \
        bin/rails db:test:prepare test test:system
    agents:
      queue: default-queue

  - label: ":rubocop: Lint"
    key: lint
    concurrency: 3
    concurrency_group: cassar/docker-lint
    command:
      - |
        docker run --rm \
          --volume "$(pwd):/rails" \
          --volume "/home/ubuntu/.bundle-cache/flourish:/bundle" \
          --workdir /rails \
          --env BUNDLE_WITHOUT="" \
          --env BUNDLE_PATH=/bundle \
          --memory 1g \
          ruby:3.4.8-slim \
          bash -c "
            apt-get update -qq &&
            apt-get install --no-install-recommends -y build-essential git libsqlite3-dev libyaml-dev pkg-config &&
            git config --global --add safe.directory '*' &&
            bundle install &&
            bundle exec rubocop
          "
      - sudo chown -R "$(id -u):$(id -g)" "$(pwd)" && sudo chown -R "$(id -u):$(id -g)" /home/ubuntu/.bundle-cache/flourish || true
    agents:
      queue: default-queue

  - label: ":shield: Audit"
    key: audit
    concurrency: 3
    concurrency_group: cassar/docker-lint
    soft_fail: true
    command:
      - |
        docker run --rm \
          --volume "$(pwd):/rails" \
          --volume "/home/ubuntu/.bundle-cache/flourish:/bundle" \
          --workdir /rails \
          --env BUNDLE_WITHOUT="" \
          --env BUNDLE_PATH=/bundle \
          --memory 1g \
          ruby:3.4.8-slim \
          bash -c "
            apt-get update -qq &&
            apt-get install --no-install-recommends -y build-essential git libsqlite3-dev libyaml-dev pkg-config &&
            git config --global --add safe.directory '*' &&
            bundle install &&
            bundle exec bundler-audit check --update
          "
      - sudo chown -R "$(id -u):$(id -g)" "$(pwd)" && sudo chown -R "$(id -u):$(id -g)" /home/ubuntu/.bundle-cache/flourish || true
    agents:
      queue: default-queue

  - wait

  - label: ":docker: Build & Push"
    key: build
    concurrency: 1
    concurrency_group: cassar/docker-build/flourish
    command:
      - echo "$$KAMAL_REGISTRY_PASSWORD" | docker login 100.115.240.52:5555 -u kamal --password-stdin
      - docker pull 100.115.240.52:5555/flourish:latest 2>/dev/null || true
      - docker build --load --cache-from 100.115.240.52:5555/flourish:latest --label service=flourish --tag 100.115.240.52:5555/flourish:$$BUILDKITE_COMMIT --tag 100.115.240.52:5555/flourish:latest .
      - docker push 100.115.240.52:5555/flourish:$$BUILDKITE_COMMIT
      - docker push 100.115.240.52:5555/flourish:latest
    agents:
      queue: default-queue
    branches: main

  - wait

  - label: ":rocket: Deploy"
    key: deploy
    concurrency: 1
    concurrency_group: cassar/shared-ec2-host-deploy
    command:
      - cp /home/ubuntu/.flourish-secrets .kamal/secrets
      - echo "KAMAL_REGISTRY_PASSWORD=$$KAMAL_REGISTRY_PASSWORD" >> .kamal/secrets
      - kamal deploy --skip-push
    agents:
      queue: default-queue
    branches: main
