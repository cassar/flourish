# Lefthook git hooks configuration
# https://github.com/evilmartians/lefthook
#
# pre-commit: quick lint of staged files. pre-push: bin/ci, the same checks as
# Buildkite (see config/ci.rb) - so the full suite runs once per push, not per commit.
#
# Skip all hooks: LEFTHOOK=0 git push
# Skip specific commands: LEFTHOOK_EXCLUDE=ci git push

pre-commit:
  parallel: false
  commands:
    rubocop:
      tags: lint
      glob: "*.rb"
      run: RUBOCOP_CACHE_ROOT=tmp/rubocop bundle exec rubocop --force-exclusion -f github {staged_files}
    eslint:
      tags: lint
      glob: "*.js"
      run: bin/with-node yarn lint:js

pre-push:
  commands:
    ci:
      run: bin/ci
