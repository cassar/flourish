name: Dependabot auto-merge

on:
  status

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  automerge:
    if: >
      github.event.state == 'success' &&
      github.event.context == 'buildkite/flourish'
    runs-on: ubuntu-latest
    steps:
      - name: Find the Dependabot PR for this commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_json=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.sha }}/pulls" \
            --jq '[.[] | select(.state == "open" and .user.login == "dependabot[bot]")] | first')
          if [ -z "$pr_json" ] || [ "$pr_json" = "null" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$pr_json" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          echo "title=$(echo "$pr_json" | jq -r '.title')" >> "$GITHUB_OUTPUT"

      - name: Determine semver update type
        if: steps.pr.outputs.found == 'true'
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          commit_message=$(gh api "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/commits" --jq '.[0].commit.message')
          if echo "$commit_message" | grep -qE '^ *update-type: version-update:semver-major *$'; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm every check and status on the PR is green
        if: steps.pr.outputs.found == 'true'
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rollup=$(gh pr view ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --json statusCheckRollup --jq '.statusCheckRollup')
          count=$(echo "$rollup" | jq 'length')
          ok=$(echo "$rollup" | jq '[.[] | select((.conclusion // .state) == "SUCCESS")] | length')
          if [ "$count" -gt 0 ] && [ "$count" = "$ok" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=pending" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge patch/minor bumps once green
        if: >
          steps.pr.outputs.found == 'true' &&
          steps.checks.outputs.state == 'success' &&
          steps.meta.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge ${{ steps.pr.outputs.number }} --repo ${{ github.repository }} --merge --delete-branch
